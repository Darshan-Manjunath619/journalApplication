spring:
  application:
    name: journal-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${JOURNAL_DB_URL}
    username: ${JOURNAL_DB_USERNAME}
    password: ${JOURNAL_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${JOURNAL_SERVICE_PORT:8081}
  servlet:
    context-path: /journal

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:journal-application}
    audience: ${JWT_AUDIENCE:journal-spa}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  datasource:
    url: jdbc:h2:mem:journal_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

security:
  jwt:
    secret: test-jwt-secret-that-is-at-least-32-bytes-long
    issuer: journal-application
    audience: journal-spa
  cors:
    allowed-origins: http://localhost:5173

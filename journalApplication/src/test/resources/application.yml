spring:
  datasource:
    url: jdbc:h2:mem:journal;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: localhost
  data:
    redis:
      repositories:
        enabled: false
weather:
  api:
    key: disabled-in-tests
security:
  jwt:
    secret: test-only-jwt-secret-at-least-32-bytes-long
    issuer: journal-application-test
    audience: journal-spa-test
    access-token-ttl: PT15M
  cors:
    allowed-origins: http://localhost:5173

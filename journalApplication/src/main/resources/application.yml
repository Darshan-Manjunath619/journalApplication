spring:
  application:
    name: journalApplication
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  jpa:
    open-in-view: false
  data:
    redis:
      repositories:
        enabled: false

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
  level:
    root: INFO
    com.darshan.journalApplication: INFO

features:
  sentiment-scheduler: false

weather:
  api:
    key: ${WEATHER_API_KEY:}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:journal-application}
    audience: ${JWT_AUDIENCE:journal-spa}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
  refresh-cookie:
    name: ${REFRESH_COOKIE_NAME:refresh_token}
    path: ${REFRESH_COOKIE_PATH:/api/v1/auth}
    secure: ${REFRESH_COOKIE_SECURE:false}

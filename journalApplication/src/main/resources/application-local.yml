spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/JournalApplication?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /journal

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/JournalApplication?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /journal
